# kairos-bus 配置 — 告警纪律与 kairos 一致,见 README「告警纪律」一节。
# 用法:kairos-bus run --config config.toml

[bus]
inbound_dir = "inbound"          # 各楼层落 JSONL 的根目录
out_dir = "out"                  # 聚合 JSONL 输出(calibration / 内容管线)
poll_seconds = 5
dedup_window_seconds = 5         # dedup 窗口:attempt 级,立即提交(限流失败重试)
symbol_cooldown_seconds = 1800   # 同 symbol 冷却:发送成功后才提交
max_alerts_per_day = 200         # bus 级每日 attention budget

[bus.telegram]
enabled = true
bot_token_env = "KAIBUS_TG_TOKEN"   # 密钥只从环境变量读,不落盘
chat_id_env = "KAIBUS_TG_CHAT"

# 楼层接入:每楼层一个 source 目录(相对 inbound_dir),落 *.jsonl;目录名 = floor 名。
# 行内可带 "floor" 覆盖目录名。
[floors.pm]
source = "pm"
allowed_event_types = ["spread_alert", "edge_alert"]
min_severity = "MEDIUM"
blacklist = []
skip_cooldown_event_types = []          # 市场级事件:不占 symbol cooldown
never_notify_event_types = ["outcome", "calibration", "snapshot"]  # 只进聚合 JSONL,永不推送

[floors.futures]
source = "futures"
allowed_event_types = ["price_velocity", "volume_spike", "market_impulse"]
min_severity = "LOW"
blacklist = ["LUNA/USDT:USDT"]
skip_cooldown_event_types = ["market_impulse"]

[floors.meme]
source = "meme"
allowed_event_types = ["sniper_signal"]
min_severity = "HIGH"
skip_cooldown_event_types = []
