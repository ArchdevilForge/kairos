[project]
name = "kairos-bus"
version = "0.1.0"
description = "Event bus for trading floors: JSONL intake -> severity/dedup/cooldown gating -> Telegram push -> aggregated JSONL for calibration & content pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.8",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["kairos_bus*"]

[project.scripts]
kairos-bus = "kairos_bus.__main__:main"

[tool.ruff]
target-version = "py312"
line-length = 120
