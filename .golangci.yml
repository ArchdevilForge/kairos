version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - errcheck
        path: internal/engine/pipeline\.go
        source: "<-done"
      - linters:
          - staticcheck
        text: "SA4023|QF1012"
    paths:
      - zz_generated_

formatters:
  exclusions:
    generated: lax
