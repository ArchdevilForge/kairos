name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.4.0)"
        required: true
        type: string

permissions:
  contents: write

# Commands are discovered from ./cmd/ at build time rather than listed here.
# A hardcoded list silently drifts: kairos-market-replay and kairos-calibrate
# were both missing from releases because nobody remembered to add them.

jobs:
  # Never publish binaries that were not verified. A tag push used to go
  # straight to build+publish without running a single test.
  check:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release tag format
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag '$TAG' (expected vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint v2
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6

      - run: make check

      - run: make cover-check

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - run: pnpm --dir desktop install --frozen-lockfile

      - run: pnpm --dir desktop run typecheck

      - run: pnpm --dir desktop run build

      - run: pnpm --dir desktop run verify:tokens

  build:
    name: build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and pack
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          pkg="kairos-${VERSION}-${GOOS}-${GOARCH}"
          mkdir -p "dist/${pkg}/config"
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi

          # Every main package under ./cmd/ ships, so a new command is released
          # the moment it exists.
          commands=""
          for dir in ./cmd/*/; do
            commands="${commands} $(basename "${dir}")"
          done
          echo "packaging:${commands}"

          for cmd in ${commands}; do
            go build -trimpath -ldflags="-s -w" \
              -o "dist/${pkg}/${cmd}${ext}" "./cmd/${cmd}"
          done

          cp config/config.yaml.example "dist/${pkg}/config/"
          cp README.md "dist/${pkg}/"

          {
            echo "kairos ${VERSION} (${GOOS}/${GOARCH})"
            echo
            echo "1. cp config/config.yaml.example ~/.config/kairos/config.yaml  # 或任意路径"
            echo "2. export TELEGRAM_BOT_TOKEN=..."
            echo "3. export TELEGRAM_CHAT_ID=..."
            echo "4. 可执行文件："
            # Deterministic across runners (glob order is locale-dependent),
            # with the daemon first since it is the main entrypoint.
            listed="$(printf '%s\n' ${commands} | LC_ALL=C sort | grep -x kairosd || true)"
            listed="${listed} $(printf '%s\n' ${commands} | LC_ALL=C sort | grep -vx kairosd || true)"
            for cmd in ${listed}; do
              case "${cmd}" in
                kairosd)              echo "   ./kairosd --config ~/.config/kairos/config.yaml               # 实时大盘/单币告警守护进程" ;;
                kairos-market-replay) echo "   ./kairos-market-replay --input ticks.jsonl                      # MarketPulse 算法回放" ;;
                kairos-calibrate)     echo "   ./kairos-calibrate --config ~/.config/kairos/config.yaml        # 用实测结果校准告警阈值" ;;
                *)                    echo "   ./${cmd}" ;;
              esac
            done
            echo
            echo "所有告警仅供人工判断，不自动交易。"
          } > "dist/${pkg}/RUN.txt"

          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip -r "${pkg}.zip" "${pkg}")
          else
            (cd dist && tar czf "${pkg}.tar.gz" "${pkg}")
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kairos-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  desktop:
    name: desktop ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: check
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            bin_name: kairosd
            eb_args: "--linux AppImage tar.gz --x64"
            artifact_name: kairos-desk-linux-x64
          - os: windows-latest
            goos: windows
            goarch: amd64
            bin_name: kairosd.exe
            eb_args: "--win nsis zip --x64"
            artifact_name: kairos-desk-win-x64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            bin_name: kairosd
            eb_args: "--mac dmg zip --arm64"
            artifact_name: kairos-desk-mac-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          SEMVER="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"

      - name: Build kairosd sidecar
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p desktop/resources-bin
          go build -trimpath -ldflags="-s -w" \
            -o "desktop/resources-bin/${{ matrix.bin_name }}" ./cmd/kairosd
          chmod +x "desktop/resources-bin/${{ matrix.bin_name }}"
          ls -lh "desktop/resources-bin/${{ matrix.bin_name }}"

      - name: Install and build desktop UI
        run: |
          set -euo pipefail
          pnpm --dir desktop install --frozen-lockfile
          pnpm --dir desktop run build

      - name: Package desktop app
        run: |
          set -euo pipefail
          pnpm --dir desktop exec electron-builder \
            ${{ matrix.eb_args }} \
            --config electron-builder.json \
            -c.extraMetadata.version="${{ steps.ver.outputs.semver }}" \
            --publish never
          ls -lh desktop/release/

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            desktop/release/*.AppImage
            desktop/release/*.tar.gz
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error

  release:
    needs: [build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute SHA256SUMS
        run: |
          set -euo pipefail
          (cd dist && sha256sum * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: dist/*
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.tag, '-') }}
