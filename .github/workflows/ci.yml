name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  desktop-light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - run: pnpm --dir desktop install --frozen-lockfile

      - run: pnpm --dir desktop run typecheck

      - run: pnpm --dir desktop run build

      - run: pnpm --dir desktop run verify:tokens

  go-light:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint v2
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6

      - run: go build ./...

      - run: go vet ./...

      - run: make fmt-check

      - run: golangci-lint run ./...

      - run: go test ./...

  check:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint v2
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6

      - run: make check

      - run: make cover-check

      # Proves every command still packages for every release target, so the
      # release job cannot break at tag time.
      - run: make cross-check

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - run: make vuln

  python-check:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # 本仓仅剩 tools/research 判定。
      - run: make check-python
