name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint v2
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6

      - run: make check

      - run: make cover-check

      # Proves every command still packages for every release target, so the
      # release job cannot break at tag time.
      - run: make cross-check

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - run: make vuln

  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # Monorepo Python 子项目(bus/floors/data-sources/coinglass/tools):
      # 每个 uv sync(含 dev 组) + pytest。无测试项目容忍 exit 5。
      - run: make check-python
