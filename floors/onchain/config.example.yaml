# Meme Coin Monitor Configuration

telegram:
  bot_token: "${TG_BOT_TOKEN}"
  chat_id: "${TG_CHAT_ID}"

chains:
  - sol
  - base
  - bsc

polling:
  interval_seconds: 30

filters:
  min_liquidity: 5000        # $5k minimum
  max_liquidity: 100000      # $100k maximum
  min_market_cap: 10000      # $10k minimum
  max_market_cap: 500000     # $500k maximum
  max_age_minutes: 120       # < 2 hours old
  min_smart_money_count: 2   # At least 2 smart wallets
  require_lp_burned: true
  reject_honeypot: true

sources:
  gmgn:
    enabled: true
  dexscreener:
    enabled: true
