# rh-sniper — Robinhood 链 meme sniper
name: meme
role: Observe                      # 六步主干:Observe(链上 meme 发现)
status: experimental               # 策略复刻,非实盘
data_sources:
  - gmgn (GMGN OpenAPI)
events:
  - event_type: sniper_signal
    severity: HIGH
    schema: kairos.event.v1
execution_permissions: none        # 只读扫描,无下单权限
entrypoint: uv run rh-sniper --help
outbound: bus/inbound/meme/*.jsonl
owner_notes: 本地 data/ 585M 不入库;run_live_*.sh 需人工确认后使用
