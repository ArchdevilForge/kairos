# smartalpha — Solana pump.fun smart-money 分析
name: solana
role: Observe                      # 链上 smart money 发现
status: experimental
data_sources:
  - solana RPC
  - pump.fun
events:
  - event_type: smart_money_flow
    severity: MEDIUM
    schema: kairos.event.v1
execution_permissions: none
entrypoint: uv run python -m smartalpha --help
outbound: bus/inbound/solana/*.jsonl
owner_notes: funders.json(私钥)不入库,用 funders.example.json
