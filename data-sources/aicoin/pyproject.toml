[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aicoin-api"
version = "0.2.0"
description = "AiCoin API toolkit: public chart APIs + reversed PC encrypted client + Open Data HMAC client"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ArchdevilForge" }]
dependencies = [
  "cryptography>=41",
]

[tool.setuptools.packages.find]
include = ["aicoin_api*"]

[dependency-groups]
dev = ["pytest>=8.0"]
